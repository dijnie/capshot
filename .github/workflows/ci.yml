name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libssl-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev \
            libxdo-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          CAPSHOT_NO_SYSTEM_FONTS: "1"
      - run: cargo build --release -p capshot-app
