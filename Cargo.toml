[workspace]
resolver = "2"
members = ["crates/capshot-core", "crates/capshot-platform", "crates/capshot-cloud", "crates/capshot-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
rust-version = "1.85"

[workspace.dependencies]
capshot-core = { path = "crates/capshot-core" }
capshot-platform = { path = "crates/capshot-platform" }
capshot-cloud = { path = "crates/capshot-cloud" }

gpui-kit = { version = "=0.9.0" }

# Core
tiny-skia = "0.11"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
log = "0.4"
anyhow = "1"

# Platform
xcap = "=0.9.8"  # 0.9.9 does not compile on Linux (ashpd 0.14 renamed SourceType::Monitor)
arboard = { version = "3.7", features = ["wayland-data-control"] }
global-hotkey = "0.9"
tray-icon = "0.26"
ksni = "0.3"
ashpd = "0.14"
auto-launch = "0.6"
notify-rust = "4.19"

# Cloud
keyring = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
rusty-s3 = "0.11"
semver = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep dev builds interactive: the compositor and image code are unusably slow
# without optimisation.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.capshot-core]
opt-level = 3
