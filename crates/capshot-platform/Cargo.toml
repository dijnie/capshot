[package]
name = "capshot-platform"
description = "OS services for capshot: capture, clipboard, hotkeys, tray, autostart"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
capshot-core.workspace = true
image.workspace = true
xcap.workspace = true
arboard.workspace = true
thiserror.workspace = true
log.workspace = true
global-hotkey.workspace = true
auto-launch.workspace = true
notify-rust.workspace = true
interprocess = "2.4"
trash = "5.3"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { workspace = true, features = ["blocking"] }
